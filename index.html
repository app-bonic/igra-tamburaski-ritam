<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamburaški ritam</title>
<meta name="description" content="Ritam igra s tamburama: prim, brač i berde. Tapkaj ili pritisni tipku točno kad nota stigne do crte. Tri brzine, kombo niz i ocjena na kraju.">
<meta name="theme-color" content="#120a33">
<link rel="icon" href="zajednicko/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="zajednicko/apple-touch-icon.png">
<link rel="stylesheet" href="zajednicko/igre.css?v=09b9727d">
<style>
  .izbor { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .izbor button { padding: 7px 15px; border-radius: 999px; border: 1.5px solid var(--crta); background: var(--plo); cursor: pointer; font-weight: 600; }
  .izbor button[aria-pressed="true"] { background: var(--narancasta); color: #2a1200; border-color: var(--narancasta); }
  .pozornica { position: relative; width: min(100%, 460px); margin: 0 auto; }
  #platno { display: block; width: 100%; height: min(68vh, 560px); border-radius: 22px; background: linear-gradient(180deg, #0b0520 0%, #1c0b44 70%, #2a0f55 100%); border: 2px solid #ff9f4355; box-shadow: 0 0 40px #ff9f4322; touch-action: none; user-select: none; cursor: pointer; }
  .preko { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; border-radius: 22px; background: #0b0520cc; }
  .preko[hidden] { display: none; }
  .preko p { color: var(--blijedo); max-width: 30ch; margin: 10px auto 18px; }
  .tipke { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--blijedo); }
  kbd { font: 700 13px 'Fredoka', sans-serif; padding: 2px 8px; border-radius: 7px; background: #ffffff1c; border: 1px solid #ffffff33; color: #fff; }
  .ocjena { font: 900 italic 84px/1 var(--naslovni); color: var(--zuta); text-shadow: 0 0 30px #ffe14d99; }
</style>
</head>
<body data-igra="igra-tamburaski-ritam">
<header class="ig-vrh"></header>
<main class="ig-omot">
  <section class="ig-naslov"><span class="znak"></span><div><h1>Tamburaški ritam</h1><p>Note padaju po tri žice — prim, brač i berde. Pritisni točno kad nota stigne do svjetleće crte. Što duži niz, to više bodova!</p></div></section>

  <div class="izbor" id="brzine"></div>
  <div class="stupci">
    <div class="pozornica">
      <canvas id="platno" aria-label="Ritam polje s tri trake"></canvas>
      <div class="preko" id="preko">
        <div>
          <button type="button" class="gumb veliki" style="--g:var(--narancasta);--gt:#2a1200;--gs:#b8671c" id="kreni">Sviraj!</button>
          <p>Na mobitelu tapkaj po traci. Na računalu:</p>
          <div class="tipke"><span><kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span> ili <span><kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd></span> ili <span><kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd></span></div>
        </div>
      </div>
    </div>
    <aside style="display:flex;flex-direction:column;gap:16px">
      <div class="statusi">
        <div class="status"><small>Bodovi</small><b id="bodovi">0</b></div>
        <div class="status"><small>Niz</small><b id="niz">0</b></div>
        <div class="status"><small>Rekord</small><b id="rek">0</b></div>
      </div>
      <div class="ploca kraj-igre" id="kraj" hidden></div>
    </aside>
  </div>
</main>
<footer class="ig-dno"></footer>
<script src="zajednicko/igre.js?v=4689b224"></script>
<script>
'use strict';
const { $, $$, zvuk, konfeti, rekord, ikona } = IG;
const TRAKE = [
  { ime: 'Prim', boja: '#ff4bd8', tipke: ['a', 'j', 'arrowleft'], tonovi: [587, 659, 740, 880, 988, 1175] },
  { ime: 'Brač', boja: '#ffe14d', tipke: ['s', 'k', 'arrowdown'], tonovi: [294, 330, 370, 440, 494, 587] },
  { ime: 'Berde', boja: '#22e3ff', tipke: ['d', 'l', 'arrowright'], tonovi: [73, 98, 110, 147] },
];
const BRZINE = { Lagano: { bpm: 84, pad: 1.9, gust: .32 }, Srednje: { bpm: 108, pad: 1.55, gust: .45 }, Brzo: { bpm: 132, pad: 1.25, gust: .55 } };
const TRAJANJE = 42, SAVRSENO = .07, DOBRO = .15;
let brzina = 'Srednje', note, pocetak, bodovi, niz, najduziNiz, pogodaka, savrsenih, igra = false, poruke = [], bljesak = [0, 0, 0], zadnjiOtkucaj;

const platno = $('#platno'), c = platno.getContext('2d');
let S = 0, V = 0;
function velicina() { const d = devicePixelRatio || 1, r = platno.getBoundingClientRect(); S = r.width; V = r.height; platno.width = S * d; platno.height = V * d; c.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', () => { velicina(); if (!igra) crtaj(0); });

function napravi() {
  const b = BRZINE[brzina], takt = 60 / b.bpm, r = IG.prng(Date.now() % 1e9), n = [];
  let prosliTon = 2;
  for (let t = 2; t < TRAJANJE; t += takt / 2) {
    const udar = Math.round((t - 2) / (takt / 2)), naDobi = udar % 2 === 0;
    // berde drži „bas” na prvoj i trećoj dobi, prim i brač sviraju melodiju
    if (naDobi && udar % 4 === 0 && r() < .75) { n.push({ t, traka: 2, ton: TRAKE[2].tonovi[Math.floor(r() * 4)] }); continue; }
    if (r() > b.gust * (naDobi ? 1.3 : .7)) continue;
    const traka = r() < .55 ? 0 : 1;
    prosliTon = Math.max(0, Math.min(5, prosliTon + Math.floor(r() * 5) - 2));
    n.push({ t, traka, ton: TRAKE[traka].tonovi[prosliTon] });
  }
  return n;
}
function kreni() {
  zvuk.klik(); velicina();
  note = napravi(); bodovi = 0; niz = 0; najduziNiz = 0; pogodaka = 0; savrsenih = 0; poruke = [];
  pocetak = performance.now() / 1000 + .3; zadnjiOtkucaj = -1; igra = true;
  $('#preko').hidden = true; $('#kraj').hidden = true; osvjezi();
  requestAnimationFrame(petlja);
}
const sada = () => performance.now() / 1000 - pocetak;
function trzaj(ton) {
  // tamburica: kratko „trzanje” — pila + oktava trokutom
  zvuk.ton(ton, .32, { tip: 'sawtooth', glasnoca: .045 });
  zvuk.ton(ton * 2, .18, { tip: 'triangle', glasnoca: .03 });
}
function udari(traka) {
  if (!igra) return;
  bljesak[traka] = 1;
  const t = sada();
  let najbliza = null;
  for (const n of note) if (!n.gotova && n.traka === traka && Math.abs(n.t - t) <= DOBRO && (!najbliza || Math.abs(n.t - t) < Math.abs(najbliza.t - t))) najbliza = n;
  if (!najbliza) { zvuk.ton(140, .06, { tip: 'square', glasnoca: .02 }); return; }
  najbliza.gotova = 'pogodak';
  const razlika = Math.abs(najbliza.t - t), savrseno = razlika <= SAVRSENO;
  niz++; najduziNiz = Math.max(najduziNiz, niz); pogodaka++; if (savrseno) savrsenih++;
  bodovi += (savrseno ? 100 : 50) * mnozitelj();
  poruka(savrseno ? 'Savršeno!' : 'Dobro', savrseno ? '#5dff9b' : '#ffe14d', traka);
  trzaj(najbliza.ton); osvjezi();
}
const mnozitelj = () => Math.min(4, 1 + Math.floor(niz / 10));
function poruka(tekst, boja, traka) { poruke.push({ tekst, boja, traka, t: performance.now() }); }
function osvjezi() { $('#bodovi').textContent = bodovi; $('#niz').textContent = niz ? `${niz}${mnozitelj() > 1 ? ' ×' + mnozitelj() : ''}` : 0; $('#rek').textContent = rekord.uzmi(); }

function petlja() {
  if (!igra) return;
  const t = sada(), takt = 60 / BRZINE[brzina].bpm;
  // tihi metronom na svaku dobu
  const otk = Math.floor((t - 2) / takt);
  if (t >= 2 && otk !== zadnjiOtkucaj && t < TRAJANJE) { zadnjiOtkucaj = otk; zvuk.ton(otk % 4 ? 1400 : 1900, .025, { tip: 'triangle', glasnoca: .018 }); }
  for (const n of note) if (!n.gotova && t - n.t > DOBRO) { n.gotova = 'promasaj'; if (niz >= 5) zvuk.ton(180, .1, { tip: 'sawtooth', glasnoca: .03 }); niz = 0; poruka('Promašaj', '#ff4d6d', n.traka); osvjezi(); }
  crtaj(t);
  if (t > TRAJANJE + 1) return kraj();
  requestAnimationFrame(petlja);
}
function crtaj(t) {
  if (!S) velicina();
  c.clearRect(0, 0, S, V);
  const sirina = S / 3, crta = V - 90, pad = BRZINE[brzina].pad;
  TRAKE.forEach((tr, i) => {
    const x = sirina * i + sirina / 2;
    // žica
    c.strokeStyle = tr.boja + '55'; c.lineWidth = i === 2 ? 4 : i === 1 ? 3 : 2;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, V); c.stroke();
    // bljesak trake
    if (bljesak[i] > 0) { const g = c.createLinearGradient(0, crta - 160, 0, crta); g.addColorStop(0, tr.boja + '00'); g.addColorStop(1, tr.boja + Math.round(bljesak[i] * 90).toString(16).padStart(2, '0')); c.fillStyle = g; c.fillRect(sirina * i + 4, crta - 160, sirina - 8, 160); bljesak[i] = Math.max(0, bljesak[i] - .08); }
    // cilj
    c.lineWidth = 4; c.strokeStyle = tr.boja; c.shadowColor = tr.boja; c.shadowBlur = 18;
    c.beginPath(); c.arc(x, crta, 26, 0, Math.PI * 2); c.stroke(); c.shadowBlur = 0;
    c.fillStyle = '#ffffffcc'; c.font = '700 13px Fredoka, sans-serif'; c.textAlign = 'center';
    c.fillText(tr.ime.toUpperCase(), x, crta + 50);
    c.fillStyle = '#ffffff66'; c.font = '600 11px Fredoka, sans-serif';
    c.fillText(`${tr.tipke[0].toUpperCase()} · ${tr.tipke[1].toUpperCase()}`, x, crta + 67);
  });
  // svjetleća crta
  c.fillStyle = '#ffffff22'; c.fillRect(0, crta - 1, S, 2);
  if (!note) return;
  for (const n of note) {
    if (n.gotova === 'pogodak') continue;
    const y = crta - (n.t - t) / pad * crta;
    if (y < -30 || y > V + 30) continue;
    const x = sirina * n.traka + sirina / 2, tr = TRAKE[n.traka];
    c.globalAlpha = n.gotova ? .25 : 1;
    c.fillStyle = tr.boja; c.shadowColor = tr.boja; c.shadowBlur = 16;
    c.beginPath(); c.arc(x, y, n.traka === 2 ? 21 : 18, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
    c.fillStyle = '#ffffffaa'; c.beginPath(); c.arc(x - 6, y - 6, 5, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
  }
  const sad = performance.now();
  poruke = poruke.filter(p => sad - p.t < 600);
  for (const p of poruke) {
    const k = (sad - p.t) / 600;
    c.globalAlpha = 1 - k; c.fillStyle = p.boja; c.font = 'italic 900 20px "Exo 2", sans-serif'; c.textAlign = 'center';
    c.fillText(p.tekst.toUpperCase(), sirina * p.traka + sirina / 2, crta - 50 - k * 30); c.globalAlpha = 1;
  }
  // napredak pjesme
  c.fillStyle = '#ff9f43'; c.fillRect(0, 0, S * Math.min(1, Math.max(0, t) / TRAJANJE), 4);
}
function kraj() {
  igra = false;
  const ukupno = note.length, tocnost = ukupno ? pogodaka / ukupno : 0;
  const ocj = tocnost >= .95 && savrsenih / Math.max(1, pogodaka) > .7 ? 'S' : tocnost >= .9 ? 'A' : tocnost >= .75 ? 'B' : tocnost >= .55 ? 'C' : 'D';
  const novi = rekord.predlozi(bodovi), el = $('#kraj'); el.hidden = false;
  el.innerHTML = `<div class="ocjena">${ocj}</div><h2>${novi && bodovi ? 'Novi rekord!' : 'Kraj pjesme'}</h2>
    <p>${bodovi} bodova · pogođeno ${pogodaka}/${ukupno} (${Math.round(tocnost * 100)} %)<br>savršenih ${savrsenih} · najduži niz ${najduziNiz}</p>`;
  $('#preko').hidden = false; $('#kreni').innerHTML = `${ikona('osvjezi')} Opet`;
  note = null; poruke = []; crtaj(0);
  osvjezi();
  if (ocj === 'S' || ocj === 'A' || (novi && bodovi)) { zvuk.pobjeda(); konfeti(); } else zvuk.poraz();
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase(), i = TRAKE.findIndex(tr => tr.tipke.includes(k));
  if (i >= 0 && igra) { e.preventDefault(); udari(i); }
  else if ((k === ' ' || k === 'enter') && !igra && document.activeElement === document.body) { e.preventDefault(); kreni(); }
});
platno.addEventListener('pointerdown', e => { const r = platno.getBoundingClientRect(); udari(Math.min(2, Math.floor((e.clientX - r.left) / r.width * 3))); });
$('#kreni').onclick = kreni;
$('#brzine').innerHTML = Object.keys(BRZINE).map(b => `<button type="button" data-b="${b}" aria-pressed="${b === brzina}">${b} · ${BRZINE[b].bpm} BPM</button>`).join('');
$('#brzine').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b || igra) return; brzina = b.dataset.b; $$('#brzine button').forEach(x => x.setAttribute('aria-pressed', x === b)); zvuk.klik(); });
velicina(); crtaj(0); osvjezi();
</script>
</body>
</html>
